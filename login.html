<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta http-equiv="X-UA-Compatible" content="ie=edge">
   <title>Login & Registration Form</title>
   <!-- basic -->
   <meta charset="utf-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <!-- site metas -->
   <title>Book Store</title>
   <!-- bootstrap css -->
   <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
   <!-- style css -->
   <link rel="stylesheet" type="text/css" href="css/style.css">
   <!-- Responsive-->
   <link rel="stylesheet" href="css/responsive.css">
   <!-- Scrollbar Custom CSS -->
   <link rel="stylesheet" href="css/jquery.mCustomScrollbar.min.css">
   <!-- Tweaks for older IEs-->
   <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
   <!-- owl stylesheets -->
   <link rel="stylesheet" href="css/owl.carousel.min.css">
   <link rel="stylesheet" href="css/owl.theme.default.min.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/2.1.5/jquery.fancybox.min.css"
      media="screen">
</head>

<body>
   <div class="header_section">
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
         <a class="logo " href="index.html"><img src="images/book (1).png" style="width: 60px; height: auto;"
               alt="Logo"></a>
         <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
         </button>
         <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
               <li class="nav-item active">
                  <a class="nav-link" href="index.html">Home</a>
               </li>
               <li class="nav-item">
                  <a class="nav-link" href="books.html">Books</a>
               </li>

            </ul>

            <div class="search_icon"><a a class="nav-link" href="login.html"><img src="images/user-icon.png"><span
                     class="padding_left_15">login</span></a></div>

         </div>
      </nav>
   </div>
   <div class="container">

      <div class="login form">
         <header class="mb-4">Login</header>
         <form action="#">
            <div class="form-group">
               <input type="text" class="form-control" placeholder="Enter your email">
            </div>
            <div class="form-group">
               <input type="password" class="form-control" placeholder="Enter your password">
            </div>
            <a href="#" class="mb-2">Forgot password?</a>
            <button type="button" class="btn btn-primary btn-block">Login</button>
         </form>
         <div class="signup">
            <span class="signup">Don't have an account?
               <label for="check">
                  <a class="nav-link" href="signup.html">Signup</a>
               </label>
            </span>
         </div>
      </div>

   </div>
   </div>

   <!-- Bootstrap JS and Popper.js -->
   <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
   <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
   <script>
      document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.querySelector('.login form');
    
        loginForm.addEventListener('submit', async (event) => {
          event.preventDefault();
    
          const email = document.querySelector('input[type="text"]').value;
          const password = document.querySelector('input[type="password"]').value;
    
          try {
            const response = await fetch('http://localhost:3000/api/users/', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ email, password }),
            });
    
            if (response.ok) {
              const data = await response.json();
              console.log('Login successful:', data);
              // Redirect or perform other actions after successful login
            } else {
              console.error('Login failed:', response.statusText);
            }
          } catch (error) {
            console.error('Error during login:', error.message);
          }
        });
      });
    </script>
    
</body>

</html>
